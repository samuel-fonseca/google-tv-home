name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  launcher:
    name: Launcher build, tests, lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write # upload Android Lint results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # JUnit and the pinned lint release, downloaded by test.sh and lint.sh.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/tvhome
          key: tvhome-${{ runner.os }}-${{ hashFiles('launcher/test.sh', 'launcher/lint.sh') }}
      - name: Install SDK platform 34 and build-tools 34.0.0
        run: '"$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" >/dev/null'
      - name: Build
        run: launcher/build.sh
      - name: Unit tests
        run: launcher/test.sh
      - name: Android Lint
        run: launcher/lint.sh
      # Code scanning needs a public repo (or GitHub Advanced Security), and fork PRs can't write to it.
      - name: Upload lint results to code scanning
        if: >-
          always() && hashFiles('launcher/build/lint.sarif') != '' && !github.event.repository.private &&
          (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: launcher/build/lint.sarif
          category: android-lint

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned rather than the runner's copy, so CI and local runs agree.
      - name: Install ShellCheck 0.11.0
        run: |
          curl -sSfLo /tmp/shellcheck.tar.xz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          echo /tmp/shellcheck-v0.11.0 >> "$GITHUB_PATH"
      - name: ShellCheck
        run: |
          shellcheck --version
          shellcheck tools/*.sh launcher/*.sh
