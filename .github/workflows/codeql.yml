name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1" # Mondays, for newly published queries
  workflow_dispatch: # Run workflow button in the Actions tab

permissions:
  contents: read

jobs:
  analyze:
    # GitHub appends the matrix language: "Analyze (java-kotlin)", "Analyze (actions)". These
    # names are required checks in the main ruleset, so keep them in sync if this changes.
    name: Analyze
    # Code scanning needs a public repo (or GitHub Advanced Security); skipped while private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # build-mode none reads the sources directly, so no Android SDK is needed here.
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
